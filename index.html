<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f4f6">
<meta name="mobile-web-app-capable" content="yes">
<title>콜린 시세판</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{
  --bg:#f2f4f6; --card:#ffffff; --ink:#191f28; --ink2:#4e5968; --ink3:#8b95a1; --line:#f2f4f6; --line2:#e5e8eb;
  --up:#f04452; --up-soft:#fff0f1; --down:#3182f6; --down-soft:#ebf3ff; --flat:#8b95a1;
  --chip:#f2f4f6; --accent:#3182f6; --ok:#03b26c; --warn:#ff9f00; --danger:#f04452; --scrim:rgba(0,0,0,.45);
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101013; --card:#1c1c21; --ink:#f2f4f6; --ink2:#c3c8cf; --ink3:#8b95a1; --line:#26262d; --line2:#33333b;
  --up:#ff5b67; --up-soft:#3a1d22; --down:#4c94ff; --down-soft:#17284a; --chip:#2a2a31; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101013; --card:#1c1c21; --ink:#f2f4f6; --ink2:#c3c8cf; --ink3:#8b95a1; --line:#26262d; --line2:#33333b;
  --up:#ff5b67; --up-soft:#3a1d22; --down:#4c94ff; --down-soft:#17284a; --chip:#2a2a31; --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{padding:0 max(14px,env(safe-area-inset-right,0px)) 32px max(14px,env(safe-area-inset-left,0px))}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:1600px;margin:0 auto}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}

/* 머리 */
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 0 8px;flex-wrap:wrap}
.top h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em}
.clock{font-size:14px;color:var(--ink3);font-weight:600}
.srcs{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.src{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--ink3);background:var(--card);border-radius:999px;padding:4px 9px}
.src i{width:7px;height:7px;border-radius:50%;background:var(--line2)}
.src.on i{background:var(--ok)} .src.slow i{background:var(--warn)} .src.off i{background:var(--up)}
.btn{height:34px;padding:0 11px;border-radius:10px;background:var(--card);font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap}
.btn:hover{background:var(--line2)}
.btn.pri{background:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.seg{display:inline-flex;background:var(--card);border-radius:10px;padding:3px}
.seg button{height:28px;padding:0 10px;border-radius:8px;font-size:12px;font-weight:700;color:var(--ink3)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 0 8px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:7px 13px;border-radius:999px;font-size:14px;font-weight:700;color:var(--ink3)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tabs button:hover:not([aria-pressed="true"]){background:var(--card)}

/* 공통 카드 */
.logo{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;overflow:hidden;font-size:12px;font-weight:800;color:#fff;letter-spacing:-.03em}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--chip);color:var(--ink2);white-space:nowrap}
.tag.live{color:var(--ok)} .tag.pre{color:var(--warn)} .tag.ours{background:var(--down-soft);color:var(--down)}
.tag.kp-up{background:var(--up-soft);color:var(--up)} .tag.kp-down{background:var(--down-soft);color:var(--down)}
.tag.rank{background:var(--ink);color:var(--bg)} .tag.need{color:var(--warn)}
/* 숫자 바뀔 때: 바뀐 자리 숫자만 위·아래로 굴러가고, 잠깐 빨강·파랑이었다가 원래 색으로 */
.d{display:inline-block;position:relative;overflow:hidden;vertical-align:top}
.px > b,.pv > b,.big,.tp > b{white-space:nowrap}
.d>i{display:inline-block;font-style:normal}
.d>i.old{position:absolute;left:0;top:0}
.d>i.n-up{animation:inUp .32s cubic-bezier(.2,.8,.2,1)} .d>i.o-up{animation:outUp .32s cubic-bezier(.2,.8,.2,1) forwards}
.d>i.n-dn{animation:inDn .32s cubic-bezier(.2,.8,.2,1)} .d>i.o-dn{animation:outDn .32s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes inUp{from{transform:translateY(70%);opacity:0}to{transform:none;opacity:1}}
@keyframes outUp{from{transform:none;opacity:1}to{transform:translateY(-70%);opacity:0}}
@keyframes inDn{from{transform:translateY(-70%);opacity:0}to{transform:none;opacity:1}}
@keyframes outDn{from{transform:none;opacity:1}to{transform:translateY(70%);opacity:0}}
.d.hl-up{animation:hlUp 1.1s ease-out} .d.hl-dn{animation:hlDn 1.1s ease-out}
@keyframes hlUp{from{color:var(--up)}} @keyframes hlDn{from{color:var(--down)}}
@media (prefers-reduced-motion:reduce){.d>i{animation:none!important}.d>i.old{display:none}}
svg.mini{display:block;width:100%;height:100%;overflow:visible}
.sec-h{display:flex;align-items:center;gap:8px;margin:12px 2px 8px;min-height:30px}
.sec-h h2{margin:0;font-size:17px;font-weight:800;display:flex;align-items:baseline;gap:8px;min-width:0}
.sec-h h2 small{font-size:12px;font-weight:600;color:var(--ink3);white-space:nowrap}
.sec-h .note{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-h .tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sec-h input{height:32px;border-radius:8px;border:1px solid var(--line2);background:var(--card);padding:0 10px;font-size:15px;font-weight:800;width:200px;max-width:45vw}
.empty{padding:14px;border-radius:14px;background:var(--card);color:var(--ink3);font-size:13px}
.connect{padding:12px 14px;border-radius:14px;background:var(--card);font-size:13px;color:var(--ink2);line-height:1.6;margin-bottom:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.connect button{height:32px;padding:0 12px;border-radius:9px;background:var(--accent);color:#fff;font-weight:700;font-size:13px}

/* 작은 카드 (기본): 태블릿 한 화면에 많이, 그래도 숫자는 크게 */
.hero{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px;margin:2px 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px}
.cc,.hc{position:relative;background:var(--card);border-radius:14px;padding:10px 12px 9px;cursor:pointer;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) 60px;column-gap:6px;align-items:center;transition:transform .12s;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.cc:active,.hc:active{transform:scale(.98)}
.cc .h,.hc .h{grid-column:1/3;grid-row:1;display:flex;align-items:center;gap:6px;min-width:0}
.cc .h .logo,.hc .h .logo{width:18px;height:18px;font-size:7px}
.cc .h b,.hc .h b{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.cc .h small,.hc .h small{display:none}
.cc .pv,.hc .pv{display:contents}
.cc .pv > b,.hc .pv > b{grid-column:1/3;grid-row:2;justify-self:start;font-size:18px;font-weight:800;letter-spacing:-.02em;margin-top:4px;white-space:nowrap;max-width:100%;overflow:hidden}
.cc .pv > span,.hc .pv > span{grid-column:1;grid-row:3;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc .ch,.hc .ch{grid-column:2;grid-row:3;height:24px}
.cc .tg,.hc .tg{grid-column:1/3;grid-row:4;display:flex;flex-wrap:wrap;gap:3px 4px;margin-top:5px}
.cc .tg:empty,.hc .tg:empty{display:none}
.cc .tg .tag,.hc .tg .tag{font-size:10.5px;padding:0 5px}
.hc .pv > b{font-size:20px}

/* 큰 카드 */
body.big .cards{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
body.big .hero{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
body.big .cc,body.big .hc{display:flex;flex-direction:column;padding:14px 16px 10px;border-radius:18px}
body.big .cc .tg,body.big .hc .tg{order:3}
body.big .cc .ch,body.big .hc .ch{order:4;align-self:stretch}
body.big .cc .h .logo,body.big .hc .h .logo{width:32px;height:32px;font-size:10px}
body.big .cc .h b,body.big .hc .h b{font-size:15px;color:var(--ink)}
body.big .cc .h small{display:block;font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.big .cc .pv,body.big .hc .pv{display:flex !important;flex-direction:column;align-items:flex-start;gap:2px;margin-top:10px;min-width:0}
body.big .cc .pv > b,body.big .hc .pv > b{font-size:22px;max-width:100%}
body.big .cc .pv > span,body.big .hc .pv > span{font-size:13.5px;max-width:100%}
body.big .cc .tg{margin-top:6px;flex-wrap:wrap;min-height:19px}
body.big .cc .tg .tag{font-size:11px;padding:1px 6px}
body.big .cc .ch{height:84px;margin-top:6px}
body.big .hc .ch{height:44px;margin-top:6px}

/* 한눈에 보기: 여러 줄로 촘촘하게 */
.lists{column-width:360px;column-gap:8px}
.lists.one{column-width:420px}
.lsec{background:var(--card);border-radius:14px;padding:2px 4px 4px;break-inside:avoid;margin-bottom:8px}
.lsec .sec-h{margin:6px 8px 2px;min-height:24px}
.lsec .sec-h h2{font-size:14px}
.lsec .sec-h .note{display:none}
.lsec .sec-h input{width:130px;height:28px;font-size:13px}
.lsec .sec-h .tools{gap:4px}
.lsec .sec-h .tools .btn{height:28px;padding:0 8px;font-size:12px;background:var(--line)}
.row{position:relative;display:grid;grid-template-columns:20px minmax(0,1fr) 84px 128px;gap:8px;align-items:center;padding:4px 6px;border-radius:8px;cursor:pointer}
.row:hover{background:var(--line)}
.row .logo{width:20px;height:20px;font-size:6px}
.row .sp{height:20px;width:84px}
.row .nm{min-width:0}
.row .nm b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm .sub{display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center;font-size:10px;color:var(--ink3)}
.row .nm .sub .tag{font-size:9px;padding:0 4px}
.row .px{text-align:right;min-width:0;overflow:hidden}
.row .px > b{display:inline-block;font-size:14.5px;font-weight:700;border-radius:5px;padding:0 3px;margin-right:-3px}
.row .px > span{display:block;font-size:11.5px;font-weight:700}
body.big .lists{columns:2 420px;column-gap:12px}
body.big .row{grid-template-columns:36px minmax(0,1fr) 110px 150px;gap:10px;padding:8px 10px}
body.big .row .logo{width:36px;height:36px;font-size:11px}
body.big .row .sp{height:30px;width:110px}
body.big .row .nm b{font-size:15px} body.big .row .nm .sub{font-size:12px}
body.big .row .px > b{font-size:15px} body.big .row .px > span{font-size:12px}

/* 편집: 꾹 누르면 아이폰처럼 흔들리고, 끌어서 옮김 */
[data-list] > [data-k]{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.editing [data-list] > [data-k]{touch-action:none;cursor:grab}
.editing [data-list]:not([data-list^="hot"]) > [data-k]:not(.dragging){animation:jig .26s ease-in-out infinite alternate}
.editing [data-list] > [data-k]:nth-child(2n):not(.dragging){animation-duration:.3s;animation-delay:-.13s}
.editing [data-list] > [data-k]:nth-child(3n):not(.dragging){animation-duration:.24s;animation-delay:-.07s}
.editing [data-list] > .row:not(.dragging){animation-name:jigRow}
@keyframes jig{from{transform:rotate(-.9deg)}to{transform:rotate(.9deg)}}
@keyframes jigRow{from{transform:translateX(-1px)}to{transform:translateX(1px)}}
[data-k].dragging{z-index:30;pointer-events:none;box-shadow:0 14px 34px rgba(0,0,0,.22);transition:none;opacity:.96;position:relative}
[data-k].landing{transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s}
.del{display:none;position:absolute;top:-7px;left:-7px;width:24px;height:24px;border-radius:50%;background:#8e8e93;color:#fff;font-size:18px;font-weight:700;line-height:22px;text-align:center;z-index:4;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.editing .del{display:block}
.row .del{top:50%;left:-4px;transform:translateY(-50%);width:20px;height:20px;line-height:18px;font-size:15px}
@media (prefers-reduced-motion:reduce){.editing [data-list] > [data-k]{animation:none!important}}
.addtile{display:none;border:2px dashed var(--line2);border-radius:14px;min-height:64px;color:var(--ink3);font-weight:800;font-size:14px;background:transparent}
.addtile:hover{border-color:var(--accent);color:var(--accent)}
.editing .addtile{display:grid;place-items:center}
.editing #editBtn{background:var(--accent);color:#fff}
.editbar{display:none;margin:12px 0;gap:8px;flex-wrap:wrap}
.editing .editbar{display:flex}
.edithint{display:none;position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:12;max-width:calc(100% - 32px);font-size:13px;font-weight:600;color:#fff;background:rgba(25,31,40,.88);border-radius:999px;padding:10px 16px;text-align:center;pointer-events:none}
.editing .edithint{display:block}
/* 마우스를 올리면 나오는 정보 카드 */
.tip{position:fixed;z-index:25;width:300px;background:var(--card);color:var(--ink);border-radius:16px;padding:14px 14px 10px;box-shadow:0 12px 40px rgba(0,0,0,.18),0 0 0 1px var(--line2);pointer-events:none;opacity:0;transform:translateY(4px) scale(.98);transition:opacity .14s,transform .14s}
.tip.on{opacity:1;transform:none}
.tip .th{display:flex;align-items:center;gap:8px}
.tip .th .logo{width:28px;height:28px;font-size:9px}
.tip .th b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tip .th small{font-size:11px;color:var(--ink3);display:block}
.tip .tp{display:flex;align-items:baseline;gap:8px;margin-top:8px;flex-wrap:wrap}
.tip .tp > b{font-size:22px;font-weight:800}
.tip .tp > span{font-size:13px;font-weight:700}
.tip .tch{height:70px;margin-top:6px}
.tip .rng2{margin-top:8px}
.tip .rng2 .bar{position:relative;height:6px;border-radius:3px;background:var(--line2);margin:6px 0 3px}
.tip .rng2 .fill{position:absolute;top:0;bottom:0;border-radius:3px;opacity:.35}
.tip .rng2 .dot{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--card)}
.tip .rng2 .op{position:absolute;top:-3px;width:2px;height:12px;background:var(--ink3);transform:translateX(-50%)}
.tip .rng2 .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3)}
.tip .rng2 .cap{font-size:11px;color:var(--ink3);font-weight:600}
.tip dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:10px 0 0;font-size:12px}
.tip dt{color:var(--ink3)} .tip dd{margin:0;text-align:right;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tip .hint{margin-top:8px;font-size:11px;color:var(--ink3);text-align:center}
@media (hover:none){.tip{display:none}}
/* 불러오는 중: 스켈레톤 */
.sk,.loading .pv > b,.loading .pv > span,.loading .px > b,.loading .px > span,.loading .ch,.loading .sp,.sk-line{background:linear-gradient(90deg,var(--line) 25%,var(--line2) 40%,var(--line) 60%);background-size:300% 100%;animation:sk 1.4s ease-in-out infinite;border-radius:6px;color:transparent!important}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.loading .pv > b,.loading .px > b{min-width:92px;min-height:1.1em}
.loading .pv > span,.loading .px > span{min-width:56px;width:56px;min-height:.95em;margin-top:4px}
.loading .px > b,.loading .px > span{display:inline-block}
.loading .ch svg,.loading .sp svg,.loading .tg{visibility:hidden}
.ch.sk svg,.sp.sk svg{visibility:hidden}
.skc{pointer-events:none}
.skc .sk-line{display:block;height:12px;margin:3px 0}
.chartbox.sk{border-radius:14px}
@media (prefers-reduced-motion:reduce){.sk,.loading .pv > b,.loading .pv > span,.loading .px > b,.loading .px > span,.loading .ch,.loading .sp,.sk-line{animation:none}}
.foot{margin-top:18px;font-size:11px;color:var(--ink3);line-height:1.6;text-align:center}
.foot a{color:inherit}

/* 덮개 (상세, 설정, 추가) */
.ov{position:fixed;inset:0;background:var(--scrim);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.on{display:flex}
.sheet{background:var(--card);width:min(980px,100%);border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:94vh;overflow:auto}
.sheet.narrow{width:min(620px,100%)}
@media (min-width:900px){.ov{align-items:center;padding:24px}.sheet{border-radius:24px}}
.sh-top{display:flex;align-items:center;gap:12px}
.sh-top .logo{width:46px;height:46px;font-size:13px}
.sh-top h3{margin:0;font-size:20px;font-weight:800}
.sh-top p{margin:2px 0 0;font-size:13px;color:var(--ink3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sh-top .x{margin-left:auto;height:38px;padding:0 16px;border-radius:10px;background:var(--chip);font-weight:700;font-size:14px;flex:none}
.big{font-size:34px;font-weight:800;margin-top:14px;line-height:1.15}
.bigc{font-size:16px;font-weight:700;margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bigc .when{color:var(--ink3);font-weight:600;font-size:14px}
.ctl{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.per{display:flex;gap:4px;background:var(--line);border-radius:12px;padding:4px}
.per button{height:34px;min-width:50px;padding:0 10px;border-radius:9px;font-size:14px;font-weight:700;color:var(--ink3)}
.per button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chartbox{position:relative;margin-top:10px;height:360px}
.chartbox .msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink3);font-size:14px;text-align:center;padding:20px;pointer-events:none;z-index:2}
.rng{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--ink3);min-height:20px}
.rng b{font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.stats div{background:var(--line);border-radius:12px;padding:9px 12px;min-width:0}
.stats small{display:block;font-size:12px;color:var(--ink3);font-weight:600}
.stats b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.meta{margin-top:12px;font-size:12px;color:var(--ink3);line-height:1.6}
.form{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.form label{font-size:13px;font-weight:700;color:var(--ink2);margin-top:4px}
.form input,.form select{width:100%;height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--bg);color:var(--ink);padding:0 12px;font-size:15px}
.form .hint{font-size:12px;color:var(--ink3);line-height:1.5;margin:0}
.form .save{height:46px;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;font-size:16px;margin-top:6px}
.form .rowbtns{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips button{height:32px;padding:0 12px;border-radius:999px;background:var(--line);font-size:13px;font-weight:700;color:var(--ink3)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.results{margin-top:10px;display:flex;flex-direction:column;gap:2px;max-height:52vh;overflow:auto}
.res{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 8px;border-radius:12px}
.res:hover{background:var(--line)}
.res .logo{width:34px;height:34px;font-size:10px}
.res b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res small{display:block;font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res button{height:34px;padding:0 14px;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;font-size:13px}
.res button:disabled{background:var(--line2);color:var(--ink3);cursor:default}
.res .err{font-size:12px;color:var(--danger);white-space:normal}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

@media (max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.chartbox{height:290px}}
@media (max-width:560px){
  .hero,.cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  body.big .cards,body.big .hero{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lists,.lists.one{columns:1}.row .sp{display:none}.row{grid-template-columns:20px minmax(0,1fr) auto}
  .srcs{display:none}.big{font-size:28px}.per button{min-width:0;padding:0 9px}
  .sec-h .note{display:none}
}
@media (prefers-reduced-motion:reduce){.cc,.hc,.cc .pv > b,.hc .pv > b,.row .px > b{transition:none}}

async function pollNaver() {

        if (d.stockName && it.custom && it.name === it.sym) { it.name = d.stockName; saveCfg(); dirty.add(k); build(); }
        const dc = d.compareToPreviousPrice && d.compareToPreviousPrice.code;   // 1 상한 2 상승 3 보합 4 하한 5 하락
        const neg = dc === "4" || dc === "5";
        const ca = Math.abs(toNum(d.compareToPreviousClosePrice)), pa = Math.abs(toNum(d.fluctuationsRatio));
        const price = toNum(d.closePrice), om = d.overMarketPriceInfo, st = S[k] || {};

          vol: toNum(d.accumulatedTradingVolume),

const ymd = d => d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
function naverBars(arr) {
  return (Array.isArray(arr) ? arr : []).map(x => {
    const s = String(x.localDateTime || x.localDate || "");
    const t = s.length >= 12 ? Date.UTC(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8), +s.slice(8, 10) - 9, +s.slice(10, 12)) / 1000
                             : Date.UTC(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8), 6) / 1000;
    const c = toNum(x.closePrice ?? x.currentPrice);
    return {t, o: toNum(x.openPrice) || c, h: toNum(x.highPrice) || c, l: toNum(x.lowPrice) || c, c, v: toNum(x.accumulatedTradingVolume) || 0};

async function naverChart(code, p) {
  const now = new Date(), from = new Date(now);
  let unit = "day";
  if (p === "1D") { unit = "minute"; from.setDate(from.getDate() - 4); }
  else if (p === "1W") { unit = "minute"; from.setDate(from.getDate() - 7); }
  else if (p === "1M") from.setDate(from.getDate() - 31);
  else if (p === "3M") from.setDate(from.getDate() - 92);
  else if (p === "1Y") from.setFullYear(from.getFullYear() - 1);
  else { unit = "week"; from.setFullYear(from.getFullYear() - 5); }
  const r = await fetch(`${proxyBase()}/chart/domestic/item/${code}/${unit}?startDateTime=${ymd(from)}0000&endDateTime=${ymd(now)}2359`);
  if (!r.ok) throw new Error(r.status);
  let bars = naverBars(await r.json());

}

/* 다른 카드가 비켜날 때 부드럽게 미끄러지게 (FLIP) */

  const before = new Map(kids.map(n => [n, n.getBoundingClientRect()]));

  const dnSel = opt("densSel", [["small", "작게 (한 화면에 많이)"], ["big", "크게 (차트 크게)"]], density);
  const msg = el("p", {class: "hint"});
  let resetArmed = false;
  const resetBtn = el("button", {class: "btn danger", style: "background:var(--line)", onclick: () => {
    if (!resetArmed) { resetArmed = true; resetBtn.textContent = "정말 처음대로? 한 번 더 누르기"; return; }
    CFG = DEFAULT_CFG(); saveCfg(); tab = "all"; build(); afterListChange(); msg.textContent = "종목과 순서를 처음 상태로 되돌렸어요."; resetBtn.textContent = "종목·순서 처음대로"; resetArmed = false;
  }}, "종목·순서 처음대로");
  sheet("narrow",
    el("div", {class: "sh-top"}, el("div", null, el("h3", null, "설정"), el("p", null, "이 기기 브라우저에만 저장돼요")), el("button", {class: "x", onclick: closeOv}, "닫기")),
    el("div", {class: "form"},
      el("label", {for: "densSel"}, "카드 크기"), dnSel,
      el("label", {for: "themeSel"}, "화면"), thSel,
      el("label", {for: "proxyIn"}, "국내주식 실시간 (선택)"), inp,
      el("p", {class: "hint"}, "비워 두면 국내주식은 20분 늦은 시세로 나와요. 안내서의 worker.js를 Cloudflare에 올리고 받은 주소를 넣으면 실시간 시세와 지난 차트가 나와요."),
      el("label", null, "되돌리기"), el("div", {class: "rowbtns"}, resetBtn),
      msg,
      el("button", {class: "save", onclick: async () => {
        theme = thSel.value; ls.set("theme", theme);
        density = dnSel.value; ls.set("density", density);
        applyTheme();
        const np = inp.value.trim();
        if (np && !/^https:\/\//.test(np)) { msg.textContent = "주소는 https:// 로 시작해야 해요."; return; }
        naverProxy = np; ls.set("naverProxy", naverProxy);
        if (naverProxy && active("naver").length) {
          msg.textContent = "국내주식 연결 확인 중..."; SRC.naver.t = 0; await pollNaver();
          msg.textContent = SRC.naver.t ? "연결됐어요." : "연결 실패. 주소를 다시 확인해 주세요.";
          if (SRC.naver.t) loadNaverSparks();
        }
        build(); if (!naverProxy || SRC.naver.t || !active("naver").length) setTimeout(closeOv, 500);
      }}, "저장")));
}

/* ================= 화면 켜두기, 전체 화면 ================= */
let wake = null;
async function requestWake() { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; paintWake(); }); }
async function toggleWake() {
  try {
    if (wake) { await wake.release(); wake = null; ls.set("wake", "0"); }
    else { await requestWake(); ls.set("wake", "1"); }
  } catch (e) { toast("이 브라우저는 화면 켜두기를 못 해요. 태블릿 화면 꺼짐 시간을 늘려 주세요."); }
  paintWake();
}
function paintWake() { $("wakeBtn").textContent = wake ? "화면 켜둠 ✓" : "화면 켜두기"; }
function toggleFs() {
  try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen({navigationUI: "hide"}); }
  catch (e) { toast("이 브라우저는 전체 화면을 못 해요"); }
}
document.addEventListener("fullscreenchange", () => { $("fsBtn").textContent = document.fullscreenElement ? "전체 화면 끄기" : "전체 화면"; });
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible") return;
  if (ls.get("wake", "0") === "1" && !wake) { try { await requestWake(); } catch (e) {} paintWake(); }
  pollCNBC(); pollKR();
});

/* ================= 시작 ================= */
$("ov").addEventListener("click", e => { if (e.target === $("ov")) closeOv(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { if ($("ov").classList.contains("on")) closeOv(); else exitEdit(); } });
$("setBtn").onclick = openSettings; $("wakeBtn").onclick = toggleWake; $("fsBtn").onclick = toggleFs;
$("editBtn").onclick = () => { closeOv(); editing ? exitEdit() : enterEdit(); };
$("addGroupBtn").onclick = addGroup;
$("addHeroBtn").onclick = () => openAdd("hero");
if (!document.documentElement.requestFullscreen) $("fsBtn").style.display = "none";
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (theme === "auto") { applyTheme(); if (openKey) drawChart(); } });
function tickClock() {
  const d = new Date(), z = n => String(n).padStart(2, "0");
  $("clock").textContent = `${d.getMonth() + 1}/${d.getDate()} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`;
}
applyTheme();
tickClock(); setInterval(tickClock, 1000);
HOTS.hot.forEach(h => coinItem(h.k.slice(6)));
HOTS.hotkr.forEach(h => krItem(h.k.slice(6), h.name));
HOTS.hotus.forEach(h => { const sym = h.k.slice(5); if (!byKey[h.k]) byKey[h.k] = {src: "cnbc", sym, name: h.name || sym, sub: sym, ab: sym.slice(0, 4), dec: 2, usd: true, mk: "US", color: hueOf(sym), tmp: true}; });
build();
connectUpbit();
connectBinance();
pollCNBC().then(() => loadCNBCSparks());
pollFxBackup();
pollKR().then(loadNaverSparks);
loadHotKR(); loadHotUS();
loadCoinGeckoSparks();
loadHot().then(() => { loadMarkets(1); loadUpbitSparks(); });
setInterval(flush, 400);
setInterval(pollCNBC, 5000);
setInterval(pollKR, 5000);
setInterval(loadHotKR, 60000);
setInterval(loadHotUS, 60000);
setInterval(pollFxBackup, 60000);
setInterval(upbitFallback, 15000);
setInterval(loadHot, 30000);
setInterval(renderSrcs, 2000);
setInterval(() => Object.keys(REF).forEach(k => dirty.add(k)), 60000);   // 장 상태 글자 갱신
setInterval(() => loadCNBCSparks(true), 10 * 60000);
setInterval(loadUpbitSparks, 10 * 60000);
setInterval(loadNaverSparks, 10 * 60000);
</script>
